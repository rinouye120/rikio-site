name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hugo Blox v0.10.0 requires Hugo >= 0.148.2. Pinned to the version the site was built and tested with.
      HUGO_VERSION: 0.167.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies (Tailwind CSS, Pagefind)
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # baseURL comes from hugo.yaml (always https://). It is deliberately NOT taken from
      # configure-pages, whose base_url can resolve to http:// and poison canonical URLs.
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: hugo --gc --minify

      - name: Build Pagefind search index
        run: npx pagefind --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
